name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore task2.sln

    - name: Build solution
      run: dotnet build task2.sln --no-restore --configuration Release

    - name: Run tests
      run: dotnet test task2.sln --no-build --configuration Release --verbosity normal

    - name: Docker build
      run: docker build --tag api:${{ github.sha }} .

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Trigger deploy hook
      env:
        DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
      run: curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL"